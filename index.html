<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Core Bit</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#080C14;--surf:#0E1420;--surf2:#141C2E;--bdr:#1E2A42;--acc:#3B82F6;--acc2:#60A5FA;--txt:#E8EDF5;--mut:#7A8BA8;--dim:#3A4A62;--grn:#22D3A5;--pur:#818CF8;--yel:#FBBF24;--red:#EF4444}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:'Space Grotesk',sans-serif;line-height:1.6;overflow-x:hidden}

nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:15px 5%;background:rgba(8,12,20,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--bdr)}
.nav-logo{display:flex;align-items:center;gap:10px;font-family:'Space Mono',monospace;font-weight:700;font-size:1.05rem;color:var(--txt);text-decoration:none;cursor:pointer}
.logo-icon{width:30px;height:30px;background:linear-gradient(135deg,var(--acc),var(--pur));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.85rem;box-shadow:0 0 20px rgba(59,130,246,.3)}
.nav-links{display:flex;align-items:center;gap:18px;list-style:none}
.nav-links a{color:var(--mut);text-decoration:none;font-size:.87rem;font-weight:500;transition:color .2s;cursor:pointer}
.nav-links a:hover{color:var(--txt)}
.nav-cta{background:var(--acc)!important;color:#fff!important;padding:7px 17px!important;border-radius:8px!important}
.nav-user{display:none;align-items:center;gap:9px}
.nav-user.visible{display:flex}
.nav-avatar{width:30px;height:30px;background:linear-gradient(135deg,var(--acc),var(--pur));border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;color:#fff}
.nav-uname{font-size:.87rem;color:var(--txt);font-weight:500}
.btn-logout{background:none;border:1px solid var(--bdr);color:var(--mut);padding:5px 11px;border-radius:7px;font-size:.78rem;cursor:pointer;transition:all .2s;font-family:'Space Grotesk',sans-serif}
.btn-logout:hover{border-color:var(--red);color:var(--red)}
.lang-sel{background:var(--surf2);border:1px solid var(--bdr);color:var(--txt);padding:5px 9px;border-radius:7px;font-size:.8rem;cursor:pointer;font-family:'Space Grotesk',sans-serif;outline:none}

.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:120px 5% 80px;overflow:hidden}
.hero::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(59,130,246,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,.04) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
.hero-glow{position:absolute;top:20%;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(59,130,246,.13) 0%,transparent 70%);pointer-events:none}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);border-radius:100px;padding:6px 15px;font-size:.78rem;color:var(--acc2);font-family:'Space Mono',monospace;margin-bottom:24px;position:relative;z-index:2}
.badge-dot{width:6px;height:6px;background:var(--grn);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
.hero h1{font-size:clamp(2.3rem,6vw,4.8rem);font-weight:700;line-height:1.08;letter-spacing:-2px;margin-bottom:20px;position:relative;z-index:2}
.hero h1 span{background:linear-gradient(135deg,var(--acc),var(--pur),var(--grn));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:clamp(.93rem,2vw,1.1rem);color:var(--mut);max-width:530px;margin-bottom:36px;position:relative;z-index:2}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;position:relative;z-index:2}
.btn-p{background:var(--acc);color:#fff;padding:12px 28px;border-radius:10px;font-weight:600;font-size:.93rem;text-decoration:none;transition:all .2s;box-shadow:0 0 28px rgba(59,130,246,.3);border:none;cursor:pointer;font-family:'Space Grotesk',sans-serif}
.btn-p:hover{background:var(--acc2);transform:translateY(-2px)}
.btn-g{background:transparent;color:var(--txt);padding:12px 28px;border-radius:10px;font-weight:600;font-size:.93rem;text-decoration:none;transition:all .2s;border:1px solid var(--bdr);cursor:pointer;font-family:'Space Grotesk',sans-serif}
.btn-g:hover{border-color:var(--acc);color:var(--acc2)}

.hero-terminal{position:relative;z-index:2;margin-top:52px;width:100%;max-width:660px;background:var(--surf);border:1px solid var(--bdr);border-radius:14px;overflow:hidden;box-shadow:0 28px 70px rgba(0,0,0,.5)}
.tbar{display:flex;align-items:center;gap:8px;padding:11px 17px;background:var(--surf2);border-bottom:1px solid var(--bdr)}
.td{width:10px;height:10px;border-radius:50%}.td.r{background:#FF5F57}.td.y{background:#FEBC2E}.td.g{background:#28C840}
.ttitle{margin-left:8px;font-family:'Space Mono',monospace;font-size:.73rem;color:var(--mut)}
.tbody{padding:20px;font-family:'Space Mono',monospace;font-size:.79rem;line-height:1.9;text-align:left}
.tu{color:var(--grn)}.ta{color:var(--acc2)}.tt{color:var(--txt)}.tdm{color:var(--mut)}
.cur{display:inline-block;width:8px;height:14px;background:var(--acc);vertical-align:middle;animation:blink 1.1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

section{position:relative;z-index:1}
.si{max-width:1100px;margin:0 auto;padding:0 5%}
.slabel{font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:2.5px;color:var(--acc);text-transform:uppercase;margin-bottom:11px}
.stitle{font-size:clamp(1.7rem,4vw,2.6rem);font-weight:700;letter-spacing:-1px;line-height:1.15;margin-bottom:13px}
.ssub{color:var(--mut);font-size:.98rem;max-width:510px;margin-bottom:46px}
.divider{border:none;border-top:1px solid var(--bdr);margin:0}

.features{padding:88px 0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:17px}
.fcard{background:var(--surf);border:1px solid var(--bdr);border-radius:13px;padding:24px;transition:border-color .25s,transform .25s}
.fcard:hover{border-color:var(--acc);transform:translateY(-3px)}
.ficon{width:40px;height:40px;border-radius:10px;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.24);display:flex;align-items:center;justify-content:center;font-size:1.1rem;margin-bottom:14px}
.fcard h3{font-size:.98rem;font-weight:600;margin-bottom:7px}
.fcard p{color:var(--mut);font-size:.85rem}

.pricing{padding:88px 0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;max-width:1060px;margin:0 auto}
.pcard{background:var(--surf);border:1px solid var(--bdr);border-radius:16px;padding:28px 24px;position:relative;transition:border-color .2s,transform .2s}
.pcard:hover{transform:translateY(-2px)}
.pcard.featured{border-color:var(--acc);box-shadow:0 0 38px rgba(59,130,246,.14)}
.pcard.deluxe{border-color:var(--pur);box-shadow:0 0 38px rgba(129,140,248,.14)}
.pcard.general{border-color:var(--grn);box-shadow:0 0 38px rgba(34,211,165,.11)}
.pbadge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);color:#fff;font-size:.68rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:4px 13px;border-radius:100px;white-space:nowrap}
.pbadge.blue{background:var(--acc)}.pbadge.purple{background:var(--pur)}.pbadge.green{background:var(--grn);color:#000}
.pname{font-family:'Space Mono',monospace;font-size:.76rem;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin-bottom:9px}
.pprice{font-size:2.5rem;font-weight:700;letter-spacing:-2px;line-height:1;margin-bottom:3px}
.pprice span{font-size:.95rem;font-weight:500;color:var(--mut);letter-spacing:0}
.pprice-alt{font-size:.78rem;color:var(--mut);margin-bottom:3px}
.pdesc{color:var(--mut);font-size:.83rem;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--bdr)}
.pfeats{list-style:none;display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.pfeats li{display:flex;align-items:flex-start;gap:8px;font-size:.85rem;color:var(--txt)}
.ck{color:var(--grn);flex-shrink:0}.cx{color:var(--dim);flex-shrink:0}
.pfeats li.off{color:var(--dim)}
.pbtn{display:block;text-align:center;padding:11px;border-radius:10px;font-weight:600;font-size:.9rem;text-decoration:none;transition:all .2s;cursor:pointer;border:none;width:100%;font-family:'Space Grotesk',sans-serif}
.pbtn.prim{background:var(--acc);color:#fff}.pbtn.prim:hover{background:var(--acc2);transform:translateY(-1px)}
.pbtn.purp{background:var(--pur);color:#fff}.pbtn.purp:hover{opacity:.85;transform:translateY(-1px)}
.pbtn.grn{background:var(--grn);color:#000;font-weight:700}.pbtn.grn:hover{opacity:.85;transform:translateY(-1px)}
.pbtn.ghost{background:transparent;color:var(--txt);border:1px solid var(--bdr)}.pbtn.ghost:hover{border-color:var(--acc);color:var(--acc2)}
.dtag{display:inline-block;background:rgba(34,211,165,.14);color:var(--grn);border:1px solid rgba(34,211,165,.28);border-radius:100px;padding:2px 9px;font-size:.7rem;font-weight:600;margin-bottom:9px}

.pay-sec{padding:65px 0}
.pay-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:9px;max-width:790px}
.pay-card{background:var(--surf);border:1px solid var(--bdr);border-radius:9px;padding:13px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.76rem;color:var(--mut);transition:border-color .2s;cursor:default}
.pay-card:hover{border-color:var(--acc2)}
.pay-card .pi{font-size:1.3rem}

.faq-sec{padding:88px 0}
.faq-list{max-width:690px;display:flex;flex-direction:column;gap:11px}
.faq-item{background:var(--surf);border:1px solid var(--bdr);border-radius:11px;overflow:hidden;transition:border-color .2s}
.faq-item:hover{border-color:var(--dim)}
.faq-q{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;cursor:pointer;font-weight:500;font-size:.9rem;gap:12px;user-select:none}
.faq-icon{color:var(--acc);font-size:1.3rem;flex-shrink:0;transition:transform .25s}
.faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s;padding:0 20px;color:var(--mut);font-size:.87rem;line-height:1.7}
.faq-item.open .faq-a{max-height:220px;padding:0 20px 15px}
.faq-item.open .faq-icon{transform:rotate(45deg)}

.foot-wrap{border-top:1px solid var(--bdr);padding:34px 5%;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:13px;max-width:1100px;margin:0 auto}
.foot-logo{font-family:'Space Mono',monospace;font-weight:700;font-size:.87rem;color:var(--mut);display:flex;align-items:center;gap:8px}
.foot-links{display:flex;gap:17px}
.foot-links a{color:var(--mut);font-size:.82rem;text-decoration:none;transition:color .2s}
.foot-links a:hover{color:var(--txt)}

/* MODALS */
.moverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);z-index:200;align-items:center;justify-content:center;padding:20px}
.moverlay.open{display:flex}
.modal{background:var(--surf);border:1px solid var(--bdr);border-radius:17px;padding:34px 30px;max-width:450px;width:100%;position:relative;max-height:90vh;overflow-y:auto}
.mclose{position:absolute;top:13px;right:15px;background:none;border:none;color:var(--mut);font-size:1.5rem;cursor:pointer;line-height:1;transition:color .2s}
.mclose:hover{color:var(--txt)}
.modal h2{font-size:1.4rem;font-weight:700;margin-bottom:5px}
.msub{color:var(--mut);font-size:.87rem;margin-bottom:20px}
.atabs{display:flex;margin-bottom:22px;border:1px solid var(--bdr);border-radius:9px;overflow:hidden}
.atab{flex:1;padding:8px;background:transparent;border:none;color:var(--mut);font-family:'Space Grotesk',sans-serif;font-size:.87rem;font-weight:600;cursor:pointer;transition:all .2s}
.atab.active{background:var(--acc);color:#fff}
.aerr{display:none;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red);border-radius:8px;padding:9px 12px;font-size:.82rem;margin-bottom:11px}
.aerr.vis{display:block}
.fgroup{display:flex;flex-direction:column;gap:13px}
.flabel{font-size:.74rem;color:var(--mut);display:block;margin-bottom:4px;font-family:'Space Mono',monospace;letter-spacing:1px;text-transform:uppercase}
.finput{width:100%;background:var(--surf2);border:1px solid var(--bdr);border-radius:8px;padding:10px 13px;color:var(--txt);font-family:'Space Grotesk',sans-serif;font-size:.92rem;outline:none;transition:border-color .2s}
.finput:focus{border-color:var(--acc)}
.finput::placeholder{color:var(--dim)}

.pix-box{background:var(--surf2);border:1px solid var(--bdr);border-radius:9px;padding:12px 16px;margin-bottom:12px}
.pix-label{font-size:.67rem;color:var(--mut);margin-bottom:5px;font-family:'Space Mono',monospace;letter-spacing:1px;text-transform:uppercase}
.pix-val{font-family:'Space Mono',monospace;font-size:.62rem;color:var(--acc2);word-break:break-all;line-height:1.7}
.pix-amt{background:var(--surf2);border:1px solid var(--bdr);border-radius:9px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.pix-amt-lbl{color:var(--mut);font-size:.79rem}
.pix-amt-val{font-size:1.5rem;font-weight:700;color:var(--grn)}
.copybtn{width:100%;padding:10px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);color:var(--acc2);border-radius:8px;font-weight:600;font-size:.83rem;cursor:pointer;transition:all .2s;margin-bottom:14px;font-family:'Space Grotesk',sans-serif}
.copybtn:hover{background:rgba(59,130,246,.2)}
.copybtn.copied{color:var(--grn);border-color:var(--grn);background:rgba(34,211,165,.1)}
.mnote{font-size:.79rem;color:var(--mut);text-align:center;line-height:1.7}
.mnote a{color:var(--acc2);text-decoration:none}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.ptab-btn{background:var(--surf2);border:1px solid var(--bdr);color:var(--mut);padding:5px 12px;border-radius:8px;font-size:.79rem;cursor:pointer;transition:all .2s;font-family:'Space Grotesk',sans-serif}
.ptab-btn.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.ppanel{display:none}.ppanel.active{display:block}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:11px}
.copt{background:var(--surf2);border:1px solid var(--bdr);border-radius:8px;padding:9px 11px;display:flex;align-items:center;gap:7px;cursor:pointer;transition:border-color .2s;font-size:.8rem}
.copt:hover{border-color:var(--acc2)}

/* TOAST */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surf);border:1px solid var(--bdr);border-radius:10px;padding:11px 20px;font-size:.86rem;font-weight:500;box-shadow:0 10px 40px rgba(0,0,0,.4);z-index:400;transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .35s;opacity:0;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.ok{border-color:var(--grn);color:var(--grn)}
.toast.err{border-color:var(--red);color:var(--red)}
.toast.info{border-color:var(--yel);color:var(--yel)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}

/* CHATBOT SCREEN */
#chatScreen{display:none;position:fixed;inset:0;z-index:500;background:var(--bg);flex-direction:column}
#chatScreen.open{display:flex}
.ctopbar{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;background:rgba(8,12,20,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--bdr);flex-shrink:0}
.ctopbar-left{display:flex;align-items:center;gap:11px}
.cback{background:none;border:none;color:var(--mut);font-size:1.2rem;cursor:pointer;transition:color .2s;padding:4px}
.cback:hover{color:var(--txt)}
.ctitle{font-weight:700;font-size:.97rem}
.csubtitle{font-size:.73rem;color:var(--mut)}
.dbadge{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,rgba(129,140,248,.2),rgba(59,130,246,.2));border:1px solid rgba(129,140,248,.4);border-radius:100px;padding:3px 11px;font-size:.73rem;color:var(--pur);font-weight:600}
.ddot{width:5px;height:5px;background:var(--pur);border-radius:50%;animation:pulse 2s infinite}
.mcounter{font-size:.73rem;color:var(--yel);font-weight:600}
.ctabs{display:flex;border-bottom:1px solid var(--bdr);background:var(--surf);flex-shrink:0}
.ctab{flex:1;padding:10px;background:transparent;border:none;color:var(--mut);font-family:'Space Grotesk',sans-serif;font-size:.86rem;font-weight:600;cursor:pointer;transition:all .2s;border-bottom:2px solid transparent}
.ctab.active{color:var(--acc);border-bottom-color:var(--acc)}

.cpanel{display:none;flex:1;flex-direction:column;overflow:hidden}
.cpanel.active{display:flex}
.cmsgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:13px}
.cmsgs::-webkit-scrollbar{width:4px}
.cmsgs::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.cmsg{display:flex;gap:9px;max-width:80%;animation:mi .25s ease}
@keyframes mi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cmsg.user{align-self:flex-end;flex-direction:row-reverse}
.mavt{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700}
.mavt.bot{background:linear-gradient(135deg,var(--acc),var(--pur))}.mavt.usr{background:linear-gradient(135deg,var(--grn),var(--acc))}
.mbub{padding:10px 14px;border-radius:13px;font-size:.86rem;line-height:1.6}
.cmsg.bot .mbub{background:var(--surf);border:1px solid var(--bdr);border-radius:4px 13px 13px 13px;color:var(--txt)}
.cmsg.user .mbub{background:var(--acc);color:#fff;border-radius:13px 4px 13px 13px}
.mbub pre{background:rgba(0,0,0,.4);border:1px solid var(--bdr);border-radius:7px;padding:10px;overflow-x:auto;margin-top:7px;font-family:'Space Mono',monospace;font-size:.77rem;line-height:1.6}
.mbub code{background:rgba(0,0,0,.3);padding:2px 5px;border-radius:4px;font-family:'Space Mono',monospace;font-size:.79rem}
.typing{display:flex;gap:4px;padding:12px 14px;background:var(--surf);border:1px solid var(--bdr);border-radius:4px 13px 13px 13px;width:fit-content}
.tdot2{width:6px;height:6px;background:var(--mut);border-radius:50%;animation:td 1.2s infinite}
.tdot2:nth-child(2){animation-delay:.2s}.tdot2:nth-child(3){animation-delay:.4s}
@keyframes td{0%,80%,100%{transform:scale(.8);opacity:.5}40%{transform:scale(1.1);opacity:1}}

.cinput-area{padding:12px 15px;border-top:1px solid var(--bdr);background:var(--surf);flex-shrink:0}
.attach-prev{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.achip{background:rgba(59,130,246,.14);border:1px solid rgba(59,130,246,.28);border-radius:6px;padding:3px 9px;font-size:.73rem;color:var(--acc2);display:flex;align-items:center;gap:4px}
.achip button{background:none;border:none;color:var(--mut);cursor:pointer;font-size:.88rem;padding:0;line-height:1}
.cinput-row{display:flex;align-items:flex-end;gap:7px;background:var(--surf2);border:1px solid var(--bdr);border-radius:11px;padding:7px 11px;transition:border-color .2s}
.cinput-row:focus-within{border-color:var(--acc)}
.cattach{display:flex;gap:5px;align-items:center}
.abtn{background:none;border:none;color:var(--mut);font-size:1.05rem;cursor:pointer;padding:3px;transition:color .2s;border-radius:5px}
.abtn:hover{color:var(--acc2);background:rgba(59,130,246,.1)}
.ctextarea{flex:1;background:transparent;border:none;color:var(--txt);font-family:'Space Grotesk',sans-serif;font-size:.88rem;outline:none;resize:none;max-height:110px;min-height:22px;line-height:1.5}
.ctextarea::placeholder{color:var(--dim)}
.csend{background:var(--acc);border:none;
