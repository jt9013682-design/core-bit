<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Core Bit — IA Avançada</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #080C14; --surface: #0E1420; --surface2: #141C2E;
      --border: #1E2A42; --accent: #3B82F6; --accent2: #60A5FA;
      --glow: rgba(59,130,246,0.18); --text: #E8EDF5; --muted: #7A8BA8;
      --dim: #3A4A62; --green: #22D3A5; --yellow: #FBBF24; --purple: #818CF8;
      --red: #EF4444;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;line-height:1.6;overflow-x:hidden}

    /* ── NAV ── */
    nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:16px 5%;background:rgba(8,12,20,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
    .nav-logo{display:flex;align-items:center;gap:10px;font-family:'Space Mono',monospace;font-weight:700;font-size:1.1rem;color:var(--text);text-decoration:none;cursor:pointer}
    .logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),#818CF8);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.9rem;box-shadow:0 0 20px var(--glow)}
    .nav-links{display:flex;align-items:center;gap:20px;list-style:none}
    .nav-links a{color:var(--muted);text-decoration:none;font-size:.88rem;font-weight:500;transition:color .2s;cursor:pointer}
    .nav-links a:hover{color:var(--text)}
    .nav-cta{background:var(--accent)!important;color:#fff!important;padding:7px 18px!important;border-radius:8px!important}
    .nav-user{display:none;align-items:center;gap:10px}
    .nav-user.visible{display:flex}
    .nav-avatar{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),#818CF8);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:#fff}
    .nav-username{font-size:.88rem;color:var(--text);font-weight:500}
    .btn-logout{background:none;border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:7px;font-size:.8rem;cursor:pointer;transition:all .2s;font-family:'Space Grotesk',sans-serif}
    .btn-logout:hover{border-color:var(--red);color:var(--red)}
    .lang-select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:7px;font-size:.82rem;cursor:pointer;font-family:'Space Grotesk',sans-serif;outline:none}

    /* ── HERO ── */
    .hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:120px 5% 80px;overflow:hidden}
    .hero::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(59,130,246,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,.04) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
    .hero-glow{position:absolute;top:20%;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(59,130,246,.14) 0%,transparent 70%);pointer-events:none}
    .hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);border-radius:100px;padding:6px 16px;font-size:.78rem;color:var(--accent2);font-family:'Space Mono',monospace;margin-bottom:24px;position:relative;z-index:2}
    .badge-dot{width:6px;height:6px;background:var(--green);border-radius:50%;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
    .hero h1{font-size:clamp(2.4rem,6vw,5rem);font-weight:700;line-height:1.08;letter-spacing:-2px;margin-bottom:20px;position:relative;z-index:2}
    .hero h1 span{background:linear-gradient(135deg,var(--accent),#818CF8,var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .hero-sub{font-size:clamp(.95rem,2vw,1.1rem);color:var(--muted);max-width:540px;margin-bottom:36px;position:relative;z-index:2}
    .hero-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;position:relative;z-index:2}
    .btn-primary{background:var(--accent);color:#fff;padding:13px 30px;border-radius:10px;font-weight:600;font-size:.95rem;text-decoration:none;transition:all .2s;box-shadow:0 0 30px rgba(59,130,246,.35);border:none;cursor:pointer;font-family:'Space Grotesk',sans-serif}
    .btn-primary:hover{background:var(--accent2);transform:translateY(-2px)}
    .btn-ghost{background:transparent;color:var(--text);padding:13px 30px;border-radius:10px;font-weight:600;font-size:.95rem;text-decoration:none;transition:all .2s;border:1px solid var(--border);cursor:pointer;font-family:'Space Grotesk',sans-serif}
    .btn-ghost:hover{border-color:var(--accent);color:var(--accent2)}

    /* TERMINAL */
    .hero-terminal{position:relative;z-index:2;margin-top:52px;width:100%;max-width:680px;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
    .terminal-bar{display:flex;align-items:center;gap:8px;padding:12px 18px;background:var(--surface2);border-bottom:1px solid var(--border)}
    .t-dot{width:10px;height:10px;border-radius:50%}
    .t-dot.r{background:#FF5F57}.t-dot.y{background:#FEBC2E}.t-dot.g{background:#28C840}
    .terminal-title{margin-left:8px;font-family:'Space Mono',monospace;font-size:.75rem;color:var(--muted)}
    .terminal-body{padding:22px;font-family:'Space Mono',monospace;font-size:.8rem;line-height:1.9;text-align:left}
    .t-user{color:var(--green)}.t-ai{color:var(--accent2)}.t-text{color:var(--text)}.t-dim{color:var(--muted)}
    .cursor{display:inline-block;width:8px;height:14px;background:var(--accent);vertical-align:middle;animation:blink 1.1s infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

    /* SECTIONS */
    section{position:relative;z-index:1}
    .section-inner{max-width:1100px;margin:0 auto;padding:0 5%}
    .section-label{font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:2.5px;color:var(--accent);text-transform:uppercase;margin-bottom:12px}
    .section-title{font-size:clamp(1.7rem,4vw,2.7rem);font-weight:700;letter-spacing:-1px;line-height:1.15;margin-bottom:14px}
    .section-sub{color:var(--muted);font-size:1rem;max-width:520px;margin-bottom:48px}
    .divider{border:none;border-top:1px solid var(--border);margin:0}

    /* FEATURES */
    .features{padding:90px 0}
    .features-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
    .feature-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px;transition:border-color .25s,transform .25s}
    .feature-card:hover{border-color:var(--accent);transform:translateY(-3px)}
    .feature-icon{width:40px;height:40px;border-radius:10px;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.25);display:flex;align-items:center;justify-content:center;font-size:1.1rem;margin-bottom:16px}
    .feature-card h3{font-size:1rem;font-weight:600;margin-bottom:7px}
    .feature-card p{color:var(--muted);font-size:.87rem}

    /* PRICING */
    .pricing{padding:90px 0}
    .pricing-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;max-width:1060px;margin:0 auto}
    .plan-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:30px 26px;position:relative;transition:border-color .2s,transform .2s}
    .plan-card:hover{transform:translateY(-2px)}
    .plan-card.featured{border-color:var(--accent);box-shadow:0 0 40px rgba(59,130,246,.15)}
    .plan-card.deluxe{border-color:var(--purple);box-shadow:0 0 40px rgba(129,140,248,.15)}
    .plan-card.general{border-color:var(--green);box-shadow:0 0 40px rgba(34,211,165,.12)}
    .plan-badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);color:#fff;font-size:.7rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:4px 14px;border-radius:100px;white-space:nowrap}
    .plan-badge.blue{background:var(--accent)}
    .plan-badge.purple{background:var(--purple)}
    .plan-badge.green{background:var(--green);color:#000}
    .plan-name{font-family:'Space Mono',monospace;font-size:.78rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
    .plan-price{font-size:2.6rem;font-weight:700;letter-spacing:-2px;line-height:1;margin-bottom:4px}
    .plan-price span{font-size:1rem;font-weight:500;color:var(--muted);letter-spacing:0}
    .plan-price-alt{font-size:.82rem;color:var(--muted);margin-bottom:4px}
    .plan-desc{color:var(--muted);font-size:.85rem;margin-bottom:22px;padding-bottom:20px;border-bottom:1px solid var(--border)}
    .plan-features{list-style:none;display:flex;flex-direction:column;gap:11px;margin-bottom:28px}
    .plan-features li{display:flex;align-items:flex-start;gap:9px;font-size:.87rem;color:var(--text)}
    .check{color:var(--green);flex-shrink:0}.cross{color:var(--dim);flex-shrink:0}
    .plan-features li.off{color:var(--dim)}
    .plan-btn{display:block;text-align:center;padding:12px;border-radius:10px;font-weight:600;font-size:.92rem;text-decoration:none;transition:all .2s;cursor:pointer;border:none;width:100%;font-family:'Space Grotesk',sans-serif}
    .plan-btn.primary{background:var(--accent);color:#fff;box-shadow:0 4px 20px rgba(59,130,246,.3)}
    .plan-btn.primary:hover{background:var(--accent2);transform:translateY(-1px)}
    .plan-btn.purple{background:var(--purple);color:#fff}
    .plan-btn.purple:hover{opacity:.85;transform:translateY(-1px)}
    .plan-btn.green-btn{background:var(--green);color:#000;font-weight:700}
    .plan-btn.green-btn:hover{opacity:.85;transform:translateY(-1px)}
    .plan-btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
    .plan-btn.ghost:hover{border-color:var(--accent);color:var(--accent2)}
    .discount-tag{display:inline-block;background:rgba(34,211,165,.15);color:var(--green);border:1px solid rgba(34,211,165,.3);border-radius:100px;padding:2px 10px;font-size:.72rem;font-weight:600;margin-bottom:10px}

    /* PAYMENT METHODS */
    .payment-section{padding:70px 0}
    .payment-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;max-width:800px}
    .payment-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);transition:border-color .2s}
    .payment-card:hover{border-color:var(--accent2)}
    .payment-card .p-icon{font-size:1.4rem}

    /* SUPPORT CHAT WIDGET */
    .support-widget{position:fixed;bottom:28px;right:28px;z-index:150}
    .support-fab{width:52px;height:52px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3rem;cursor:pointer;box-shadow:0 4px 20px rgba(59,130,246,.4);border:none;transition:transform .2s}
    .support-fab:hover{transform:scale(1.08)}
    .support-panel{display:none;position:absolute;bottom:64px;right:0;width:320px;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
    .support-panel.open{display:flex;flex-direction:column}
    .support-header{background:var(--surface2);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
    .support-header h4{font-size:.9rem;font-weight:600}
    .support-header span{color:var(--muted);font-size:.78rem}
    .support-close{background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer}
    .support-msgs{flex:1;max-height:240px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
    .support-msg{padding:10px 12px;border-radius:10px;font-size:.82rem;line-height:1.5;max-width:85%}
    .support-msg.bot{background:var(--surface2);color:var(--text);align-self:flex-start}
    .support-msg.user{background:var(--accent);color:#fff;align-self:flex-end}
    .support-input-row{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border)}
    .support-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:.83rem;outline:none}
    .support-input:focus{border-color:var(--accent)}
    .support-send{background:var(--accent);border:none;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:.9rem}

    /* FAQ */
    .faq{padding:90px 0}
    .faq-list{max-width:700px;display:flex;flex-direction:column;gap:12px}
    .faq-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .2s}
    .faq-item:hover{border-color:var(--dim)}
    .faq-q{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer;font-weight:500;font-size:.92rem;gap:12px;user-select:none}
    .faq-icon{color:var(--accent);font-size:1.3rem;flex-shrink:0;transition:transform .25s}
    .faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s;padding:0 20px;color:var(--muted);font-size:.88rem;line-height:1.7}
    .faq-item.open .faq-a{max-height:220px;padding:0 20px 16px}
    .faq-item.open .faq-icon{transform:rotate(45deg)}

    /* MODAL BASE */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);z-index:200;align-items:center;justify-content:center;padding:20px}
    .modal-overlay.open{display:flex}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:36px 32px;max-width:460px;width:100%;position:relative;max-height:90vh;overflow-y:auto}
    .modal-close{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--muted);font-size:1.5rem;cursor:pointer;line-height:1;transition:color .2s}
    .modal-close:hover{color:var(--text)}
    .modal h2{font-size:1.45rem;font-weight:700;margin-bottom:6px}
    .modal>.modal-sub{color:var(--muted);font-size:.88rem;margin-bottom:22px}

    /* AUTH TABS */
    .auth-tabs{display:flex;margin-bottom:24px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
    .auth-tab{flex:1;padding:9px;background:transparent;border:none;color:var(--muted);font-family:'Space Grotesk',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s}
    .auth-tab.active{background:var(--accent);color:#fff}
    .auth-error{display:none;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red);border-radius:8px;padding:9px 13px;font-size:.83rem;margin-bottom:12px}
    .auth-error.visible{display:block}
    .form-group{display:flex;flex-direction:column;gap:14px}
    .form-label{font-size:.75rem;color:var(--muted);display:block;margin-bottom:5px;font-family:'Space Mono',monospace;letter-spacing:1px;text-transform:uppercase}
    .form-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:.93rem;outline:none;transition:border-color .2s}
    .form-input:focus{border-color:var(--accent)}
    .form-input::placeholder{color:var(--dim)}

    /* PIX MODAL */
    .pix-amount{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
    .pix-amount-label{color:var(--muted);font-size:.8rem}
    .pix-amount-value{font-size:1.5rem;font-weight:700;color:var(--green)}
    .pix-key-box{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:12px}
    .pix-key-label{font-size:.68rem;color:var(--muted);margin-bottom:5px;font-family:'Space Mono',monospace;letter-spacing:1px;text-transform:uppercase}
    .pix-key-value{font-family:'Space Mono',monospace;font-size:.63rem;color:var(--accent2);word-break:break-all;line-height:1.7}
    .copy-btn{width:100%;padding:11px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);color:var(--accent2);border-radius:8px;font-weight:600;font-size:.85rem;cursor:pointer;transition:all .2s;margin-bottom:16px;font-family:'Space Grotesk',sans-serif}
    .copy-btn:hover{background:rgba(59,130,246,.2)}
    .copy-btn.copied{color:var(--green);border-color:var(--green);background:rgba(34,211,165,.1)}
    .modal-note{font-size:.8rem;color:var(--muted);text-align:center;line-height:1.7}
    .modal-note a{color:var(--accent2);text-decoration:none}
    .payment-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
    .ptab{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:6px 13px;border-radius:8px;font-size:.8rem;cursor:pointer;transition:all .2s;font-family:'Space Grotesk',sans-serif}
    .ptab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .pay-panel{display:none}.pay-panel.active{display:block}
    .card-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
    .card-opt{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:border-color .2s;font-size:.82rem}
    .card-opt:hover{border-color:var(--accent2)}
    .card-opt input[type=radio]{accent-color:var(--accent)}

    /* TOAST */
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 22px;font-size:.88rem;font-weight:500;box-shadow:0 10px 40px rgba(0,0,0,.4);z-index:300;transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .35s;opacity:0;pointer-events:none;white-space:nowrap}
    .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
    .toast.success{border-color:var(--green);color:var(--green)}
    .toast.error{border-color:var(--red);color:var(--red)}
    .toast.info{border-color:var(--yellow);color:var(--yellow)}

    /* SPINNER */
    .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── CHATBOT SCREEN ── */
    #chatScreen{display:none;position:fixed;inset:0;z-index:500;background:var(--bg);flex-direction:column}
    #chatScreen.open{display:flex}

    /* Chat top bar */
    .chat-topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(8,12,20,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);flex-shrink:0}
    .chat-topbar-left{display:flex;align-items:center;gap:12px}
    .chat-back{background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;transition:color .2s;padding:4px}
    .chat-back:hover{color:var(--text)}
    .chat-title{font-weight:700;font-size:1rem}
    .chat-subtitle{font-size:.75rem;color:var(--muted)}
    .deluxe-badge{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,rgba(129,140,248,.2),rgba(59,130,246,.2));border:1px solid rgba(129,140,248,.4);border-radius:100px;padding:4px 12px;font-size:.75rem;color:var(--purple);font-weight:600}
    .deluxe-badge .d-dot{width:5px;height:5px;background:var(--purple);border-radius:50%;animation:pulse 2s infinite}
    .msg-counter{font-size:.75rem;color:var(--yellow);font-weight:6
